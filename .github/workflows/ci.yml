name: Continuous Integration
on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**', '!update/**', '!pr/**']

jobs:
  check-js-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: coursier/cache-action@v8
      - uses: VirtusLab/scala-cli-setup@main
      - run: scala-cli test .
      - run: scala-cli --power package . -o index.js -f
      - run: git diff --quiet index.js

  test-action-itself:
    needs: check-js-file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Scrapes the live pages too, so it also fails when a site changes its format.
      - uses: ./
        with:
          sources: test/sources.json
          output: out/events.json
      - run: jq -e 'any(.title == "Far future" and .dateTo == "2099-01-03T18:00:00+01:00")' out/events.json
